name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java (JDK 21) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Paketleri yükle
        run: npm ci

      - name: Web derle
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle wrapper indir (dogru surum)
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1 --distribution-type all

      - name: APK derle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: butce-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
